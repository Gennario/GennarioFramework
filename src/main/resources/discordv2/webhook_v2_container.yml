# ============================================
# Discord Webhook V2 - Components V2 Complete Example
# ============================================
# Supports Discord Components V2 with all features:
# - Container (type 17) with accent_color: null = NO color bar
# - TextDisplay, MediaGallery, Separator, File components
# - ActionRows with Buttons (Link, Primary, Secondary, Success, Danger)
# - String Select Menus
# - Placeholders: %player%, %server_name%, etc.
#
# API: Uses /api/v10/webhooks/ with ?with_components=true
# ============================================

enabled: true

# Your Discord webhook URL
url: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"

# Custom bot username & avatar (optional)
username: "GennarioBot"
avatar: "https://i.imgur.com/oBPXx0D.png"

# Message text - appears ABOVE containers (optional)
# Use for pinging roles: <@&ROLE_ID>, users: <@USER_ID>, @everyone
message: ""

# ============================================
# CONTAINERS (Components V2)
# Main building blocks for Discord Messaging v2
# ============================================
containers:
  # Container 1 - Main announcement with NO color bar
  main-announcement:
    # accent-color options:
    # - "none" or "transparent" = NO color bar (transparent)
    # - "#5865F2" = Discord Blurple
    # - "#FF0000" = Red, "#00FF00" = Green, etc.
    accent-color: "none"
    spoiler: false
    components:
      # TextDisplay - Markdown text with headers
      header:
        type: text
        content: "# 📢 Server Announcement"

      # Another TextDisplay with description
      description:
        type: text
        content: |
          Welcome to our server, **%player%**!
          
          This message is using **Discord Components V2** which allows:
          • No color sidebar (transparent)
          • Multiple text sections
          • Images and media galleries
          • Interactive components

      # Separator - Visual divider
      divider:
        type: separator
        divider: true
        spacing: 1  # 1 = small, 2 = large

      # Media Gallery - Display images
      images:
        type: media-gallery
        items:
          - url: "https://i.imgur.com/oBPXx0D.png"
            description: "Server Banner"
          - url: "https://i.imgur.com/example.png"
            spoiler: false

  # Container 2 - With colored sidebar
  info-container:
    accent-color: "#5865F2"  # Discord Blurple
    components:
      info-text:
        type: text
        content: |
          **ℹ️ Server Information**
          
          Server: %server_name%
          Players: %online_players%/%max_players%
          Your ping: %player_ping%ms

  # Container 3 - Another no-color container
  footer-container:
    accent-color: "none"
    components:
      footer-text:
        type: text
        content: "Thanks for reading! 🎉"

# ============================================
# ACTION ROWS (Buttons & Select Menus)
# Up to 5 rows, each can contain buttons OR one select menu
# ============================================
action-rows:
  # Row 1 - Link buttons (URL buttons)
  row-1:
    buttons:
      website:
        style: link
        label: "🌐 Website"
        url: "https://example.com"
        emoji: "🌐"

      discord:
        style: link
        label: "💬 Discord"
        url: "https://discord.gg/example"
        emoji: "💬"

      store:
        style: link
        label: "🛒 Store"
        url: "https://store.example.com"

  # Row 2 - Interactive buttons (require bot to handle)
  # Note: These only work with Discord bots, not webhooks
