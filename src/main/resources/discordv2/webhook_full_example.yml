        label: "💬 Discord"
        url: "https://discord.gg/example"
        emoji: "💬"

      store:
        style: link
        label: "🛒 Store"
        url: "https://store.example.com"
        emoji: "🛒"

      vote:
        style: link
        label: "⭐ Vote"
        url: "https://vote.example.com"
        emoji: "⭐"

      wiki:
        style: link
        label: "📖 Wiki"
        url: "https://wiki.example.com"
        emoji: "📖"

  # ----------------------------------------
  # Row 2 - More Link Buttons
  # ----------------------------------------
