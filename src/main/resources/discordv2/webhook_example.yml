# ============================================
# Discord Webhook V2 Configuration Example
# ============================================

# Enable/disable the webhook
enabled: true

# Your Discord webhook URL
url: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"

# Custom bot username
username: "GennarioBot"

# Custom avatar URL
avatar: "https://i.imgur.com/oBPXx0D.png"

# Simple text content (optional)
content: "Hello **world**! This is a test message."

# ============================================
# EMBEDS (Supported by webhooks)
# ============================================
embeds:
  # Embed with color
  main-embed:
    title: "📢 Notification"
    description: "This is an embed with a **colored** sidebar."
    color: "#5865F2"
    thumbnail: "https://i.imgur.com/oBPXx0D.png"
    image: "https://i.imgur.com/oBPXx0D.png"
    footer:
      text: "Gennario Framework"
      icon: "https://i.imgur.com/oBPXx0D.png"
    author:
      name: "Author Name"
      icon: "https://i.imgur.com/oBPXx0D.png"
    fields:
      field-1:
        name: "Field"
        value: "Value"
        inline: true
      field-2:
        name: "Another Field"
        value: "Another Value"
        inline: true

  # Embed without explicit color (uses Discord default gray)
  # NOTE: Classic webhook embeds do NOT support truly transparent/invisible color bar!
  # The "none" option gives Discord's default gray, which is the closest available.
  # For truly invisible sidebar, you would need Discord Components V2 with Containers,
  # which requires a Discord Bot application, not a webhook.
  no-color-embed:
    title: "Default Gray Color Bar"
    description: "This embed uses Discord's **default gray** sidebar color."
    # Options for color:
    # - "#5865F2" = specific HEX color (blurple)
    # - "none" = Discord default gray (no explicit color)
    # - not specified = Discord default gray
    #
    # ⚠️ TRUE "no color bar" is NOT possible with classic embeds!
    # Classic embeds always have a color bar (explicit or default gray).
    color: "none"
    fields:
      info:
        name: "Limitation"
        value: "Classic embeds always have a color bar. Use `color: \"none\"` for default gray."
        inline: false

# ============================================
# IMPORTANT NOTES
# ============================================
#
# WEBHOOKS support:
#   ✅ content (text)
#   ✅ embeds (always have color bar - explicit or default gray)
#   ✅ polls
#   ❌ transparent/no color bar - NOT possible with classic embeds!
#
# For truly invisible color bar (accent_color: null), use
# Discord Components V2 with Containers - see webhook_v2_container.yml
#
# Poll example (uncomment to use):
# poll:
#   question: "What is your favorite?"
#   duration-hours: 24
#   allow-multiselect: false
#   answers:
#     answer-1:
#       text: "Option 1"
#       emoji: "1️⃣"
#     answer-2:
#       text: "Option 2"
#       emoji: "2️⃣"
